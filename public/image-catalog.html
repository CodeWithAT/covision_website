    :root {

      --accent-glow: rgba(0, 102, 255, 0.4);
      --text: #F1F5F9;
      --text-muted: #94A3B8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
      line-height: 1.5;
    }
    .header {
      background: radial-gradient(ellipse at 50% 0%, rgba(0, 102, 255, 0.15), transparent 70%);
      border-bottom: 1px solid var(--card-border);
      padding: 48px 24px 32px;
      text-align: center;
      position: sticky;
      top: 0;
      backdrop-filter: blur(20px);
      z-index: 40;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 102, 255, 0.15);
      border: 1px solid rgba(0, 102, 255, 0.4);
      color: #38BDF8;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      padding: 4px 12px;
      border-radius: 9999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      background: #38BDF8;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 760px;
      margin: 0 auto 28px;
    }
    .tabs-wrap {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      max-width: 1300px;
      margin: 0 auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }
    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .tab-btn.active {
      background: #0066FF;
      color: #FFFFFF;
      border-color: #38BDF8;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.35);
    }
    .tab-count {
      background: rgba(0, 0, 0, 0.3);
      padding: 1px 7px;
      border-radius: 9999px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
    }
    .container {
      max-width: 1400px;
      margin: 36px auto 0;
      padding: 0 24px;
    }
    .category-header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 16px;
    }
    .category-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .category-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-col: column;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover);
      box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 102, 255, 0.15);
    }
    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #0D111A;
      overflow: hidden;
      cursor: zoom-in;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .card:hover .img-wrap img {
      transform: scale(1.06);
    }
    .rank-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      backdrop-filter: blur(8px);
      z-index: 10;
      letter-spacing: 0.05em;
    }
    .rank-primary {
      background: rgba(0, 102, 255, 0.85);
      color: #FFFFFF;
      border: 1px solid rgba(56, 189, 248, 0.6);
      box-shadow: 0 2px 8px rgba(0, 102, 255, 0.5);
    }
    .rank-alt {
      background: rgba(15, 23, 42, 0.85);
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 12px;
      flex: 1;
    }
    .card-actions {
      display: flex;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .photo-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #64748B;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
      max-width: 140px;
    }
    .copy-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #38BDF8;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .copy-btn:hover {
      background: #0066FF;
      color: #FFFFFF;
      border-color: #0066FF;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0066FF;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 102, 255, 0.4);
      display: none;
      z-index: 100;

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;

      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);

    .lightbox-close {
      position: absolute;
      top: 24px;
      right: 24px;
      color: white;
      font-size: 28px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: none;

    function renderGallery(filter = 'all') {
      const container = document.getElementById('galleryContainer');
      container.innerHTML = '';

      for (const [key, category] of Object.entries(MASTER_DATA)) {
        if (filter !== 'all' && filter !== key) continue;

        const catSection = document.createElement('section');
        catSection.innerHTML = `
          <div class="category-header">
            <div>
              <h2 class="category-title">${category.title}</h2>
              <p class="category-desc">${category.desc}</p>
            </div>
            <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #38BDF8; font-weight: 700;">
              ${category.items.length} OPTIONS CURATED
            </div>
          </div>
          <div class="grid">
            ${category.items.map((item, idx) => `
              <div class="card">
                <div class="img-wrap" onclick="openLightbox('https://images.unsplash.com/${item.id}?auto=format&fit=crop&w=1600&q=90')">
                  <span class="rank-tag ${idx === 0 ? 'rank-primary' : 'rank-alt'}">${item.badge}</span>
                  <img src="https://images.unsplash.com/${item.id}?auto=format&fit=crop&w=600&h=380&q=82" alt="${item.title}" loading="lazy">
                </div>
                <div class="card-body">
                  <div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-meta">${item.desc}</p>
                  </div>
                  <div class="card-actions">
                    <span class="photo-id">${item.id}</span>
                    <button class="copy-btn" onclick="copyId('${item.id}', this)">Copy ID</button>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(catSection);
      }
    }

    // Tabs functionality
    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.category);
      });
    });

    // Copy ID functionality
    function copyId(id, btn) {
      navigator.clipboard.writeText(id).then(() => {
        const originalText = btn.textContent;
        btn.textContent = 'Copied!';
        btn.style.background = '#10B981';
        btn.style.borderColor = '#10B981';
        btn.style.color = '#FFF';
        
        const toast = document.getElementById('toast');
        toast.textContent = `Copied "${id}" to clipboard!`;
        toast.style.display = 'block';
        setTimeout(() => {
          toast.style.display = 'none';
          btn.textContent = originalText;
          btn.style.background = '';
          btn.style.borderColor = '';
          btn.style.color = '';
        }, 2000);
      });
    }

    // Lightbox functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const lightboxClose = document.getElementById('lightboxClose');

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.style.display = 'flex';
    }

    lightboxClose.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.style.display = 'none';
    });

    // Initial render
    renderGallery('all');
  </script>
